
name: Yurikago website monitor test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check website pages
        run: |
          python3 - <<'PY'
          import urllib.request
          import hashlib
          import sys

          pages = {
              "新着情報": "https://yurikago-kobe.com/topics.php",
              "出勤情報": "https://yurikago-kobe.com/schedule.php",
              "三宮": "https://yurikago-kobe.com/?sannomiyamap=",
              "JR尼崎": "https://yurikago-kobe.com/?amagasakimap=",
          }

          failed = False

          for name, url in pages.items():
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "YurikagoWebsiteMonitor/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      content_type = response.headers.get(
                          "Content-Type", ""
                      )
                      body = response.read()

                  if status != 200:
                      print(f"ERROR: {name}: HTTP {status}")
                      failed = True
                      continue

                  if not body or b"<html" not in body.lower():
                      print(f"WARNING: {name}: HTMLを確認できません")
                      failed = True
                      continue

                  digest = hashlib.sha256(body).hexdigest()[:12]
                  print(
                      f"OK: {name}: HTTP {status}, "
                      f"HTML取得成功, fingerprint={digest}"
                  )

              except Exception as exc:
                  print(f"ERROR: {name}: {type(exc).__name__}")
                  failed = True

          if failed:
              print("監視テストに問題があります。投稿は行っていません。")
              sys.exit(1)

          print("監視テスト成功。今回はページ取得のみで、投稿はしていません。")
          PY
